<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Subtle top shine -->
  <rect width="64" height="32" rx="14" fill="url(#shine)"/>

  <!-- Pipeline funnel shape -->
  <!-- Top bar — wide intake -->
  <rect x="12" y="13" width="40" height="7" rx="3.5" fill="white" opacity="0.95"/>

  <!-- Middle bar — narrowing -->
  <rect x="19" y="25" width="26" height="7" rx="3.5" fill="white" opacity="0.85"/>

  <!-- Bottom bar — qualified/output -->
  <rect x="26" y="37" width="12" height="7" rx="3.5" fill="white" opacity="0.75"/>

  <!-- Downward arrow stem -->
  <rect x="30" y="44" width="4" height="5" rx="1" fill="white" opacity="0.9"/>

  <!-- Arrow head -->
  <polygon points="26,49 38,49 32,56" fill="white" opacity="0.9"/>
</svg>
